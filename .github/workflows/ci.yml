name: Managed build and repository checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  managed-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build MCP and managed libraries
        run: dotnet build src/AutoSolidWorks.ModelingMcp/AutoSolidWorks.ModelingMcp.csproj --configuration Release
      - name: Validate public source structure
        run: python scripts/check-repository.py
      - name: Focused managed regressions
        run: |
          dotnet run --project tests/FocusedCore/FocusedCore.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/DrawingRegression/DrawingRegression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
